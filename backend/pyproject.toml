[project]
name = "blogsystem-backend"
version = "0.1.0"
description = "FastAPI backend for a personal blog system."
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.40,<2",
    "fastapi>=0.138.2",
    "psycopg[binary]>=3.2,<4",
    "python-dotenv>=1.1,<2",
    "python-multipart>=0.0.20",
    "requests>=2.31",
    "sqlmodel>=0.0.27",
    "uvicorn>=0.49.0",
]

[dependency-groups]
dev = ["httpx>=0.28,<1", "pytest>=8,<10"]
